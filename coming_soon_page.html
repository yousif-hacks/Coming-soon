<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Yousifjerjis@gmail.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Base page reset & theme setup */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #0b021a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 1. Animated Blurred Gradient Background */
        .bg-gradient-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            filter: blur(55px);
            transform: scale(1.25); /* Prevents harsh blurred edges on viewport bounds */
            pointer-events: none;
        }

        .gradient-blob {
            position: absolute;
            border-radius: 50%;
            opacity: 0.85;
            animation: moveGradient 20s infinite alternate ease-in-out;
            will-change: transform;
        }

        /* Deep Indigo & Violet */
        .blob-1 {
            width: 75vw;
            height: 75vw;
            max-width: 700px;
            max-height: 700px;
            background: radial-gradient(circle, #7e22ce 0%, #1e1b4b 100%);
            top: -15%;
            left: -15%;
            animation-duration: 18s;
        }

        /* Vibrant Magenta */
        .blob-2 {
            width: 80vw;
            height: 80vw;
            max-width: 750px;
            max-height: 750px;
            background: radial-gradient(circle, #c026d3 0%, #4c1d95 100%);
            bottom: -20%;
            right: -15%;
            animation-duration: 24s;
            animation-delay: -6s;
        }

        /* Deep Purple Accent */
        .blob-3 {
            width: 60vw;
            height: 60vw;
            max-width: 550px;
            max-height: 550px;
            background: radial-gradient(circle, #e0e7ff 0%, #9333ea 70%, #312e81 100%);
            top: 25%;
            left: 20%;
            opacity: 0.6;
            animation-duration: 21s;
            animation-delay: -12s;
        }

        @keyframes moveGradient {
            0% {
                transform: translate(0px, 0px) scale(1) rotate(0deg);
            }
            33% {
                transform: translate(70px, -60px) scale(1.12) rotate(120deg);
            }
            66% {
                transform: translate(-50px, 50px) scale(0.92) rotate(240deg);
            }
            100% {
                transform: translate(40px, -30px) scale(1.05) rotate(360deg);
            }
        }

        /* 2. Glassmorphism Panel Styles */
        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Gradient Typography & Glow Effect */
        .gradient-title {
            background: linear-gradient(135deg, #ffffff 0%, #f472b6 50%, #c026d3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 35px rgba(192, 38, 211, 0.45);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .glass-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .glass-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(244, 114, 182, 0.7);
            box-shadow: 0 0 25px rgba(192, 38, 211, 0.4);
        }

        .gradient-btn {
            background: linear-gradient(135deg, #c026d3 0%, #7e22ce 100%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .gradient-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(192, 38, 211, 0.5);
            background: linear-gradient(135deg, #d946ef 0%, #9333ea 100%);
        }
    </style>
</head>
<body class="p-4 sm:p-6 md:p-10 relative">

    <!-- 1. Animated Blurred Purple/Magenta Liquid Background -->
    <div class="bg-gradient-container" aria-hidden="true">
        <div class="gradient-blob blob-1"></div>
        <div class="gradient-blob blob-2"></div>
        <div class="gradient-blob blob-3"></div>
    </div>

    <!-- 2. Main Frosted Glass Card -->
    <main class="glass-card relative z-10 w-full max-w-3xl rounded-3xl p-6 sm:p-10 md:p-14 text-center flex flex-col items-center gap-8 my-auto">
        
        <!-- Status Badge -->
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full glass-box text-xs sm:text-sm font-medium tracking-wider uppercase text-pink-200">
            <span class="w-2 h-2 rounded-full bg-pink-400 animate-pulse"></span>
            Launching Soon
        </div>

        <!-- Title & Subtitle -->
        <div class="space-y-3 max-w-2xl">
            <h1 class="text-4xl sm:text-6xl md:text-7xl font-extrabold tracking-tight gradient-title">
                COMING SOON
            </h1>
            <p class="text-base sm:text-lg md:text-xl text-purple-100/90 max-w-lg mx-auto font-light leading-relaxed">
                We are building something extraordinary.
            </p>
        </div>

        <!-- 3. Countdown Timer (3 Months Target) -->
        <div class="grid grid-cols-4 gap-2 sm:gap-4 w-full max-w-lg">
            <div class="glass-box p-3 sm:p-4 rounded-2xl flex flex-col items-center">
                <span id="days" class="text-2xl sm:text-4xl font-bold text-white tracking-tight">90</span>
                <span class="text-[10px] sm:text-xs text-purple-200/70 uppercase tracking-widest mt-1">Days</span>
            </div>
            <div class="glass-box p-3 sm:p-4 rounded-2xl flex flex-col items-center">
                <span id="hours" class="text-2xl sm:text-4xl font-bold text-white tracking-tight">00</span>
                <span class="text-[10px] sm:text-xs text-purple-200/70 uppercase tracking-widest mt-1">Hours</span>
            </div>
            <div class="glass-box p-3 sm:p-4 rounded-2xl flex flex-col items-center">
                <span id="minutes" class="text-2xl sm:text-4xl font-bold text-white tracking-tight">00</span>
                <span class="text-[10px] sm:text-xs text-purple-200/70 uppercase tracking-widest mt-1">Mins</span>
            </div>
            <div class="glass-box p-3 sm:p-4 rounded-2xl flex flex-col items-center">
                <span id="seconds" class="text-2xl sm:text-4xl font-bold text-white tracking-tight">00</span>
                <span class="text-[10px] sm:text-xs text-purple-200/70 uppercase tracking-widest mt-1">Secs</span>
            </div>
        </div>

        <!-- 4. Email Contact & Notification Section -->
        <div class="w-full max-w-md space-y-4">
            <form id="subscribe-form" class="flex flex-col sm:flex-row gap-3" onsubmit="handleContact(event)">
                <input 
                    type="email" 
                    id="user-email"
                    required 
                    placeholder="Enter your email" 
                    class="glass-input px-5 py-3.5 rounded-xl sm:rounded-2xl flex-1 text-sm sm:text-base"
                >
                <button 
                    type="submit" 
                    class="gradient-btn px-7 py-3.5 rounded-xl sm:rounded-2xl font-semibold text-sm sm:text-base text-white tracking-wide cursor-pointer whitespace-nowrap"
                >
                    Get In Touch
                </button>
            </form>

            <a 
                href="mailto:Yousifjerjis@gmail.com" 
                class="inline-block text-xs sm:text-sm text-pink-300 hover:text-white transition-colors underline underline-offset-4"
            >
                Or email directly: Yousifjerjis@gmail.com
            </a>
        </div>

        <!-- Confirmation Toast Message -->
        <div id="status-message" class="hidden text-xs sm:text-sm text-pink-200 bg-pink-500/20 border border-pink-500/30 px-5 py-2.5 rounded-xl transition-all">
            ✨ Opening email client to contact <strong>Yousifjerjis@gmail.com</strong>...
        </div>

        <!-- 5. Minimalist Footer (Strictly No Social Media) -->
        <footer class="pt-6 border-t border-white/10 w-full flex flex-col sm:flex-row justify-between items-center gap-2 text-xs text-purple-200/60 font-light">
            <span>© 2026 All Rights Reserved</span>
            <a href="mailto:Yousifjerjis@gmail.com" class="hover:text-pink-300 transition-colors font-medium">
                Contact: Yousifjerjis@gmail.com
            </a>
        </footer>

    </main>

    <script>
        // 3-Month Real-time Countdown JS (90 days from current date)
        const THREE_MONTHS_IN_MS = 90 * 24 * 60 * 60 * 1000;
        const targetDate = new Date().getTime() + THREE_MONTHS_IN_MS;

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById('days').innerText = String(days).padStart(2, '0');
                document.getElementById('hours').innerText = String(hours).padStart(2, '0');
                document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
                document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
            } else {
                document.getElementById('days').innerText = '00';
                document.getElementById('hours').innerText = '00';
                document.getElementById('minutes').innerText = '00';
                document.getElementById('seconds').innerText = '00';
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Contact action triggering mailto:
        function handleContact(e) {
            e.preventDefault();
            const userEmail = document.getElementById('user-email').value;
            const statusMsg = document.getElementById('status-message');
            
            statusMsg.classList.remove('hidden');
            
            setTimeout(() => {
                window.location.href = `mailto:Yousifjerjis@gmail.com?subject=Inquiry%20from%20Coming%20Soon%20Page&body=Hello,%20my%20email%20is%20${encodeURIComponent(userEmail)}`;
            }, 600);
        }
    </script>
</body>
</html>
